<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sistema Farmacia{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans leading-normal tracking-normal">

    <nav class="bg-gray-800 p-4 shadow-md">
        <div class="container mx-auto flex items-center space-x-6">
            <a href="{{ url_for('medicamento_bp.index') }}" class="text-white hover:text-gray-300 font-semibold transition duration-300">Inicio</a>
            <a href="{{ url_for('medicamento_bp.crear') }}" class="text-gray-300 hover:text-white font-semibold transition duration-300">Registrar Medicamento</a>
            <a href="{{ url_for('categoria_bp.index') }}" class="text-gray-300 hover:text-white font-semibold transition duration-300">Categorías</a>
        </div>
    </nav>

    <div class="container mx-auto p-8 mt-8 bg-white rounded-lg shadow-lg max-w-5xl">
        {% block content %}
        {% endblock %}
    </div>

</body>
</html>

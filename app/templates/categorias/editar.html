{% extends "base.html" %}
{% block title %}Editar Categoría{% endblock %}

{% block content %}
<h1 class="text-2xl font-bold text-gray-800 mb-6">Editar Categoría</h1>

<form action="{{ url_for('categoria_bp.editar', id=categoria.id_categoria) }}" method="POST" class="space-y-4 max-w-lg">
    <div>
        <label class="block text-gray-700 font-bold mb-1">Nombre</label>
        <input type="text" name="nombre" value="{{ categoria.nombre }}" class="w-full px-3 py-2 border rounded-lg" required>
    </div>
    <div>
        <label class="block text-gray-700 font-bold mb-1">Descripción</label>
        <input type="text" name="descripcion" value="{{ categoria.descripcion }}" class="w-full px-3 py-2 border rounded-lg">
    </div>
    <div>
        <label class="inline-flex items-center font-bold text-gray-700">
            <input type="checkbox" name="estado" {% if categoria.estado %}checked{% endif %} class="mr-2"> Categoría Activa
        </label>
    </div>
    <div class="pt-2">
        <button type="submit" class="bg-amber-600 text-white px-4 py-2 rounded-lg font-bold hover:bg-amber-700">Actualizar</button>
        <a href="{{ url_for('categoria_bp.index') }}" class="ml-4 text-gray-600 hover:underline">Cancelar</a>
    </div>
</form>
{% endblock %}

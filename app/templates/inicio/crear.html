{% extends "base.html" %}
{% block title %}Registrar Medicamento{% endblock %}

{% block content %}
<h1 class="text-2xl font-bold text-gray-800 mb-6">Registrar Nuevo Medicamento</h1>

<form action="{{ url_for('medicamento_bp.crear') }}" method="POST" class="space-y-4 max-w-lg">
    <div>
        <label class="block text-gray-700 font-bold mb-1">Nombre</label>
        <input type="text" name="nombre" class="w-full px-3 py-2 border rounded-lg" required>
    </div>
    <div>
        <label class="block text-gray-700 font-bold mb-1">Precio</label>
        <input type="number" step="0.01" name="precio" class="w-full px-3 py-2 border rounded-lg" required>
    </div>
    <div>
        <label class="block text-gray-700 font-bold mb-1">Stock</label>
        <input type="number" name="stock" class="w-full px-3 py-2 border rounded-lg" required>
    </div>
    <div>
        <label class="block text-gray-700 font-bold mb-1">Categoría</label>
        <select name="id_categoria" class="w-full px-3 py-2 border rounded-lg bg-white" required>
            {% for cat in categorias %}
                <option value="{{ cat.id_categoria }}">{{ cat.nombre }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="pt-2">
        <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded-lg font-bold hover:bg-blue-700">Guardar</button>
        <a href="{{ url_for('medicamento_bp.index') }}" class="ml-4 text-gray-600 hover:underline">Cancelar</a>
    </div>
</form>
{% endblock %}

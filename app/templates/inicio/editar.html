{% extends "base.html" %}
{% block title %}Editar Medicamento{% endblock %}

{% block content %}
<h1 class="text-2xl font-bold text-gray-800 mb-6">Editar Medicamento</h1>

<form action="{{ url_for('medicamento_bp.editar', id=medicamento.id_medicamento) }}" method="POST" class="space-y-4 max-w-lg">
    <div>
        <label class="block text-gray-700 font-bold mb-1">Nombre</label>
        <input type="text" name="nombre" value="{{ medicamento.nombre }}" class="w-full px-3 py-2 border rounded-lg" required>
    </div>
    <div>
        <label class="block text-gray-700 font-bold mb-1">Precio</label>
        <input type="number" step="0.01" name="precio" value="{{ medicamento.precio }}" class="w-full px-3 py-2 border rounded-lg" required>
    </div>
    <div>
        <label class="block text-gray-700 font-bold mb-1">Stock</label>
        <input type="number" name="stock" value="{{ medicamento.stock }}" class="w-full px-3 py-2 border rounded-lg" required>
    </div>
    <div>
        <label class="block text-gray-700 font-bold mb-1">Categoría</label>
        <select name="id_categoria" class="w-full px-3 py-2 border rounded-lg bg-white" required>
            {% for cat in categorias %}
                <option value="{{ cat.id_categoria }}" {% if cat.id_categoria == medicamento.id_categoria %}selected{% endif %}>
                    {{ cat.nombre }}
                </option>
            {% endfor %}
        </select>
    </div>
    <div class="pt-2">
        <button type="submit" class="bg-amber-600 text-white px-4 py-2 rounded-lg font-bold hover:bg-amber-700">Actualizar</button>
        <a href="{{ url_for('medicamento_bp.index') }}" class="ml-4 text-gray-600 hover:underline">Cancelar</a>
    </div>
</form>
{% endblock %}
